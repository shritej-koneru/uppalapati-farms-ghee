name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Lets a deploy be re-run by hand from the Actions tab, which is how you
  # confirm the setup after adding the secrets without needing a fresh commit.
  workflow_dispatch:

# Read the repo, publish the site. Nothing else.
permissions:
  contents: read

# If a second push lands while a deploy is still running, replace the running
# one rather than queueing behind it. Without this a rapid series of pushes
# deploys stale builds in the order they finished rather than the order they
# were pushed.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # v5 is the first of these to run on Node 24. GitHub now deprecates the
      # Node 20 runtime that v4 targets and force-runs it anyway, so v4 works
      # but warns on every run.
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Vite 7 refuses to run on anything below 20.19, so pin the major
          # rather than letting setup-node guess.
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Lint, syntax and the order-sheet structure test. This was missing, so
      # the deploy step would happily publish a workbook that Excel refuses to
      # open — which is exactly what happened once: styles.xml went out with no
      # <fills> and no <borders>, and every order sheet since has opened behind
      # a repair prompt. Nothing here needs a browser or a network, so it runs
      # in a couple of seconds and gates the publish.
      - name: Check
        run: npm run check

      # Deliberately the same script as the local deploy rather than a
      # reimplementation of it. If the build or deploy flags ever change, this
      # picks them up from package.json instead of drifting out of sync here.
      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Wrangler cannot infer which account an API token belongs to, so
          # unlike a local login it has to be told.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Keeps wrangler from phoning home during CI. Not required, just quiet.
          WRANGLER_SEND_METRICS: 'false'
